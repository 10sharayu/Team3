# =============================================================================
# TICKET-ADV049 — dev profile: H2 in-memory + Kafka can be disabled if not running
# =============================================================================
spring:
  datasource:
    # H2 PostgreSQL-compat mode. NON_KEYWORDS=USER lets us name a JPA entity
    # `users` without H2 treating it as a reserved word; CASE_INSENSITIVE_IDENTIFIERS
    # lets CSV column names match the unquoted Liquibase column declarations.
    url: jdbc:h2:mem:reconx;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;NON_KEYWORDS=USER
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2

  # H2 doesn't ship a JSONB type — Liquibase preconditions in the changelog skip
  # the JSONB GIN-index step on H2 (see 003-jsonb.xml).
  jpa:
    properties:
      hibernate.dialect: org.hibernate.dialect.H2Dialect

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    listener:
      missing-topics-fatal: false   # don't blow up if Kafka isn't running locally

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
    consumer:
      group-id: reconx-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.dbtraining.reconx.dto
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.dbtraining.reconx.dto.TradeEvent

# =============================================================================
# TICKET-ADV083-TICKET-ADV086 / TICKET-ADV097 — Actuator + Prometheus exposure
#  Custom metrics registered by com.dbtraining.reconx.observability.TradeMetrics
#  scrape via /actuator/prometheus.
# =============================================================================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,env,loggers
      base-path: /actuator
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
        reconciliation.duration: true
      percentiles:
        http.server.requests: 0.5, 0.95, 0.99
    tags:
      application: ${spring.application.name}

logging:
  level:
    com.dbtraining.reconx: DEBUG
  
  